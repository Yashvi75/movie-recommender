<!DOCTYPE html>
<html>
<head>
    <title>Movie Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: white;
        }
        .movie-card {
            text-align: center;
        }
        .movie-card img {
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .movie-card img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">🎬 Movie Recommendation System</h1>

    <form action="{% url 'recommend' %}" method="post" class="d-flex justify-content-center mb-5">
        {% csrf_token %}
        <input type="text" name="movie" class="form-control w-50 me-2" placeholder="Enter movie name" required>
        <button type="submit" class="btn btn-danger">Recommend</button>
    </form>

    {% if movie_data %}
        <h3 class="mb-4">Recommended Movies</h3>

        <div class="row">
            {% for name, poster in movie_data %}
                <div class="col-md-2 movie-card mb-4">
                    <img src="{{ poster }}" class="img-fluid">
                    <p class="mt-2">{{ name }}</p>
                </div>
            {% endfor %}
        </div>
    {% endif %}

</div>

</body>
</html>
